# Runs on every pull request (and pushes to main): types, lint, unit + integration
# tests against a real Postgres, then the browser tests against a production build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/soloos_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/soloos_e2e
      # Only used by `next typegen`/tooling that reads it; tests use the URLs above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/soloos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the Playwright report when browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
